<path d="M240,175 l9,-5 v10 z" class="ah_sg"/>
<text x="285" y="192" class="al" text-anchor="middle" >CC1/CC2</text>
<path d="M240,310 L330,310" class="pw"/>
<path d="M330,310 l-9,-5 v10 z" class="ah_pw"/>
<text x="285" y="302" class="al" text-anchor="middle" >VBAT</text>
