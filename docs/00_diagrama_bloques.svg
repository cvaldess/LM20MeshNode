<text x="1220" y="738" class="al" text-anchor="middle" >BLE 2,4 GHz (antena del módulo)</text>
<rect x="40" y="880" width="820" height="340" rx="7" class="frame"/>
<text x="52" y="900" class="ft" text-anchor="start" >Matriz de estados de alimentación (¿quién queda apagado con otro vivo y qué los une?)</text>
<text x="56" y="920" class="th" text-anchor="start" >Estado</text>
<text x="250" y="920" class="th" text-anchor="start" >Líneas entre dominios</text>
<text x="470" y="920" class="th" text-anchor="start" >Riesgo y quién lo resuelve</text>
<path d="M50,926 L850,926" class="thin"/>
<text x="56" y="944" class="td" text-anchor="start" >GNSS apagado (BUCK1 off)</text>
<text x="250" y="944" class="td" text-anchor="start" >TX MCU→RXD (R402 1k), RX, PPS, RST</text>
<text x="470" y="944" class="td" text-anchor="start" >TX alto alimentaría el GNSS por su ESD ⇒ FIRMWARE: TX a 0/entrada</text>
<rect x="48" y="955" width="804" height="24" fill="#f1f5f9"/>
<text x="56" y="968" class="td" text-anchor="start" ></text>
<text x="250" y="968" class="td" text-anchor="start" >V_BCKP desde 3V3 (R401 1k)</text>
<text x="470" y="968" class="td" text-anchor="start" >deseado: RTC y efemérides vivos</text>
<text x="56" y="992" class="td" text-anchor="start" >OLED / SHT41 / IMU / Qwiic</text>
<text x="250" y="992" class="td" text-anchor="start" >I²C con pull-ups propios</text>
<text x="470" y="992" class="td" text-anchor="start" >siempre en 3V3 ⇒ no hay estado parcial (HARDWARE)</text>
<rect x="48" y="1003" width="804" height="24" fill="#f1f5f9"/>
<text x="56" y="1016" class="td" text-anchor="start" >E22 (en 3V3 siempre)</text>
<text x="250" y="1016" class="td" text-anchor="start" >SPI, BUSY, DIO1, NRST, RXEN</text>
<text x="470" y="1016" class="td" text-anchor="start" >mismo raíl que el MCU ⇒ sin riesgo</text>
<text x="56" y="1040" class="td" text-anchor="start" >Ship mode / batería a 0</text>
<text x="250" y="1040" class="td" text-anchor="start" >todo apagado salvo nPM1300</text>
<text x="470" y="1040" class="td" text-anchor="start" >370 nA; sale con SW101 o al enchufar USB</text>
<rect x="48" y="1051" width="804" height="24" fill="#f1f5f9"/>
<text x="56" y="1064" class="td" text-anchor="start" >Sólo USB, sin batería</text>
<text x="250" y="1064" class="td" text-anchor="start" >VBUS límite 100 mA por defecto</text>
<text x="470" y="1064" class="td" text-anchor="start" >TX LoRa o zumbador &gt; 100 mA ⇒ FIRMWARE: 500 mA</text>
<text x="56" y="1088" class="td" text-anchor="start" >USB sin firmware de PMIC</text>
<text x="250" y="1088" class="td" text-anchor="start" >VBUS_MCU (VBUSOUT) al módulo</text>
<text x="470" y="1088" class="td" text-anchor="start" >USB CDC funciona; no carga hasta el driver</text>
<rect x="880" y="880" width="800" height="340" rx="7" class="frame"/>
<text x="892" y="900" class="ft" text-anchor="start" >Consumo orientativo (3V3 desde LiPo) y hojas</text>
<text x="896" y="920" class="th" text-anchor="start" >Consumidor</text>
<text x="1090" y="920" class="th" text-anchor="start" >Corriente</text>
<text x="1210" y="920" class="th" text-anchor="start" >Nota</text>
<path d="M890,926 L1670,926" class="thin"/>
<text x="896" y="944" class="td" text-anchor="start" >E22 en RX continua</text>
<text x="1090" y="944" class="td" text-anchor="start" >≈ 7 mA</text>
<text x="1210" y="944" class="td" text-anchor="start" >Meshtastic escucha siempre (manual E22 §2.2)</text>
<rect x="888" y="953" width="784" height="22" fill="#f1f5f9"/>
<text x="896" y="966" class="td" text-anchor="start" >E22 en TX 22 dBm</text>
<text x="1090" y="966" class="td" text-anchor="start" >100–140 mA</text>
<text x="1210" y="966" class="td" text-anchor="start" >ráfagas; C301 22 µF + BUCK2</text>
<text x="896" y="988" class="td" text-anchor="start" >nRF54LM20A + BLE</text>
<text x="1090" y="988" class="td" text-anchor="start" >≈ 1–3 mA medio</text>
<text x="1210" y="988" class="td" text-anchor="start" >conexión BLE con el móvil</text>
<rect x="888" y="997" width="784" height="22" fill="#f1f5f9"/>
<text x="896" y="1010" class="td" text-anchor="start" >GNSS seguimiento</text>
<text x="1090" y="1010" class="td" text-anchor="start" >25–27 mA</text>
<text x="1210" y="1010" class="td" text-anchor="start" >conmutado por PIN_GPS_EN (BUCK1)</text>
<text x="896" y="1032" class="td" text-anchor="start" >OLED encendido</text>
<text x="1090" y="1032" class="td" text-anchor="start" >10–23 mA</text>
<text x="1210" y="1032" class="td" text-anchor="start" >se apaga por timeout (sleep ~3 µA)</text>
<rect x="888" y="1041" width="784" height="22" fill="#f1f5f9"/>
<text x="896" y="1054" class="td" text-anchor="start" >⇒ 1500 mAh</text>
<text x="1090" y="1054" class="td" text-anchor="start" >≈ 7 días sin GNSS</text>
<text x="1210" y="1054" class="td" text-anchor="start" >≈ 1,7 días con GNSS siempre encendido</text>
<text x="896" y="1090" class="ts" text-anchor="start" >Hojas: 00 bloques (raíz) · 01 alimentación · 02 MCU · 03 LoRa · 04 GNSS · 05 interfaz.</text>
<text x="896" y="1109" class="ts" text-anchor="start" >Entre hojas: etiquetas jerárquicas (azul). Alimentación: símbolos globales GND, 3V3, VSYS,</text>
<text x="896" y="1128" class="ts" text-anchor="start" >VBAT, V_GNSS, VBUS (rojo). Las cifras de consumo son de los datasheets, no medidas:</text>
<text x="896" y="1147" class="ts" text-anchor="start" >medir con el INA en el banco antes de fiarse del cálculo de autonomía.</text>
</svg>