<rect width="1720" height="1240" fill="#ffffff"/>
<text x="24" y="36" class="h1" text-anchor="start" >00 · nrf54lm20-meshnode — diagrama de bloques</text>
<text x="24" y="56" class="h2" text-anchor="start" >Nodo Meshtastic de bolsillo: nRF54LM20A (BLE al móvil) + LoRa 868 + GNSS + OLED · LiPo 1S · USB-C · 4 capas</text>
<path d="M960,40 L994,40" class="pw"/>
<text x="1000" y="44" class="ts" text-anchor="start" >alimentación</text>
<path d="M1110,40 L1144,40" class="sg"/>
<text x="1150" y="44" class="ts" text-anchor="start" >señales</text>
<path d="M1260,40 L1294,40" class="df"/>
<text x="1300" y="44" class="ts" text-anchor="start" >USB</text>
<path d="M1410,40 L1444,40" class="rf"/>
<text x="1450" y="44" class="ts" text-anchor="start" >RF 50 Ω</text>
<path d="M1560,40 L1594,40" class="gn"/>
<text x="1600" y="44" class="ts" text-anchor="start" >conmutada por firmware</text>
<rect x="40" y="110" width="200" height="90" rx="8" class="blkp"/>
<text x="140.0" y="130" class="bt" text-anchor="middle" >USB-C  J101</text>
<text x="140.0" y="148" class="bs" text-anchor="middle" >KH-TYPE-C-16P · ESD U102/D101</text>
<text x="140.0" y="163" class="bs" text-anchor="middle" >hoja 01</text>
<rect x="40" y="270" width="200" height="80" rx="8" class="blkp"/>
<text x="140.0" y="290" class="bt" text-anchor="middle" >LiPo 1S  J102</text>
<text x="140.0" y="308" class="bs" text-anchor="middle" >JST PH 2.0 · NTC RT101</text>
<text x="140.0" y="323" class="bs" text-anchor="middle" >hoja 01</text>
<rect x="330" y="110" width="270" height="300" rx="8" class="blkp"/>
<text x="465.0" y="130" class="bt" text-anchor="middle" >PMIC nPM1300  U101</text>
<text x="465.0" y="148" class="bs" text-anchor="middle" >cargador 32–800 mA (JEITA)</text>
<text x="465.0" y="163" class="bs" text-anchor="middle" >BUCK2 → 3V3 (arranque)</text>
<text x="465.0" y="178" class="bs" text-anchor="middle" >BUCK1 → V_GNSS (firmware)</text>
<text x="465.0" y="193" class="bs" text-anchor="middle" >VBUSOUT con OVP → VBUS_MCU</text>
<text x="465.0" y="208" class="bs" text-anchor="middle" >CC de USB-C (Rd interno)</text>
<text x="465.0" y="223" class="bs" text-anchor="middle" >ship mode · botón PWR SW101</text>
<text x="465.0" y="238" class="bs" text-anchor="middle" >LEDs carga D102/D103</text>
<text x="465.0" y="253" class="bs" text-anchor="middle" >I²C 0x6B · IRQ → MCU</text>
<text x="465.0" y="268" class="bs" text-anchor="middle" >hoja 01</text>
<rect x="700" y="470" width="300" height="300" rx="8" class="blk"/>
<text x="850.0" y="490" class="bt" text-anchor="middle" >MCU ME54BS13  U201</text>
<text x="850.0" y="508" class="bs" text-anchor="middle" >nRF54LM20A · M33 128 MHz</text>
<text x="850.0" y="523" class="bs" text-anchor="middle" >2 MB RRAM · 512 KB RAM</text>
<text x="850.0" y="538" class="bs" text-anchor="middle" >BLE 6.0 antena PCB (al canto)</text>
<text x="850.0" y="553" class="bs" text-anchor="middle" >USB 2.0 HS nativo (CDC/UF2)</text>
<text x="850.0" y="568" class="bs" text-anchor="middle" >SPIM22 · UARTE20 · TWIM30</text>
<text x="850.0" y="583" class="bs" text-anchor="middle" >SWD J201 2×5 · UART TP201/202</text>
<text x="850.0" y="598" class="bs" text-anchor="middle" >VBAT_SENSE → AIN2</text>
<text x="850.0" y="613" class="bs" text-anchor="middle" >π FB201 en VCC</text>
<text x="850.0" y="628" class="bs" text-anchor="middle" >hoja 02</text>
<rect x="1130" y="110" width="260" height="150" rx="8" class="blkr"/>
<text x="1260.0" y="130" class="bt" text-anchor="middle" >LoRa E22-900MM22S  U301</text>
<text x="1260.0" y="148" class="bs" text-anchor="middle" >SX1262 · 22 dBm · cristal pasivo</text>
<text x="1260.0" y="163" class="bs" text-anchor="middle" >RXEN por MCU, TXEN = DIO2</text>
<text x="1260.0" y="178" class="bs" text-anchor="middle" >π + U.FL J301</text>
<text x="1260.0" y="193" class="bs" text-anchor="middle" >hoja 03</text>
<rect x="1130" y="330" width="260" height="150" rx="8" class="blkg"/>
<text x="1260.0" y="350" class="bt" text-anchor="middle" >GNSS E108-GN04S  U401</text>
<text x="1260.0" y="368" class="bs" text-anchor="middle" >BDS/GPS/GLO/GAL · 25 mA</text>
<text x="1260.0" y="383" class="bs" text-anchor="middle" >UART 38400 · PPS</text>
<text x="1260.0" y="398" class="bs" text-anchor="middle" >U.FL J401 activa/pasiva</text>
<text x="1260.0" y="413" class="bs" text-anchor="middle" >hoja 04</text>
<rect x="1130" y="560" width="260" height="165" rx="8" class="blk"/>
<text x="1260.0" y="580" class="bt" text-anchor="middle" >Interfaz</text>
<text x="1260.0" y="598" class="bs" text-anchor="middle" >SHT41 U501 (0x44) · OLED DS501 (0x3C)</text>
<text x="1260.0" y="613" class="bs" text-anchor="middle" >IMU U502 (0x6A): despertar al moverlo</text>
<text x="1260.0" y="628" class="bs" text-anchor="middle" >Qwiic J501 · botones ↑ OK ↓ · LED D501</text>
<text x="1260.0" y="643" class="bs" text-anchor="middle" >zumbador BZ501 (desde VSYS)</text>
<text x="1260.0" y="658" class="bs" text-anchor="middle" >hoja 05</text>
<rect x="1480" y="145" width="200" height="70" rx="8" class="blkr"/>
<text x="1580.0" y="165" class="bt" text-anchor="middle" >Antena 868 MHz</text>
<text x="1580.0" y="183" class="bs" text-anchor="middle" >U.FL</text>
<rect x="1480" y="365" width="200" height="70" rx="8" class="blkg"/>
<text x="1580.0" y="385" class="bt" text-anchor="middle" >Antena GNSS</text>
<text x="1580.0" y="403" class="bs" text-anchor="middle" >U.FL (activa o pasiva)</text>
<rect x="1480" y="600" width="200" height="70" rx="8" class="blk"/>
<text x="1580.0" y="620" class="bt" text-anchor="middle" >Móvil (BLE)</text>
<text x="1580.0" y="638" class="bs" text-anchor="middle" >app Meshtastic</text>
<path d="M240,140 L330,140" class="pw"/>
<path d="M330,140 l-9,-5 v10 z" class="ah_pw"/>
<text x="285" y="132" class="al" text-anchor="middle" >VBUS</text>
