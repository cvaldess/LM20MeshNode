<text x="1052" y="300" class="al" text-anchor="end" >SPI · BUSY</text>
<text x="1052" y="314" class="al" text-anchor="end" >DIO1 · NRST</text>
<text x="1052" y="328" class="al" text-anchor="end" >RXEN</text>
