<path d="M760,770 l-5,9 h10 z" class="ah_df"/>
<text x="390" y="844" class="al" text-anchor="middle" >USB_DP / USB_DM (90 Ω)</text>
<path d="M600,150 L1130,150" class="pw"/>
<path d="M1130,150 l-9,-5 v10 z" class="ah_pw"/>
<text x="860" y="142" class="al" text-anchor="middle" >3V3 (BUCK2)</text>
<path d="M600,380 L740,380 L740,470" class="pw"/>
<path d="M740,470 l-5,-9 h10 z" class="ah_pw"/>
<text x="670" y="372" class="al" text-anchor="middle" >3V3</text>
<path d="M600,350 L820,350 L820,470" class="pw"/>
<path d="M820,470 l-5,-9 h10 z" class="ah_pw"/>
<text x="860" y="342" class="al" text-anchor="middle" >VBUS_MCU</text>
<path d="M600,250 L1100,250" class="gn"/>
<text x="860" y="242" class="al" text-anchor="middle" >V_GNSS (BUCK1 ⇐ PIN_GPS_EN)</text>
