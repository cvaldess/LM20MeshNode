<path d="M1130,440 l-9,-5 v10 z" class="ah_sg"/>
<text x="1050" y="552" class="al" text-anchor="middle" >UART · PPS · RST</text>
<path d="M1000,640 L1130,640" class="sg"/>
<path d="M1130,640 l-9,-5 v10 z" class="ah_sg"/>
<text x="1065" y="632" class="al" text-anchor="middle" >I²C · GPIO</text>
